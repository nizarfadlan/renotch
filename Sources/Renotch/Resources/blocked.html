<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus Blocker — Re:notch</title>
  <style>
    /* ==========================================================================
       APPLE DESIGN SYSTEM — FOCUS BLOCKER & SCREEN TAKEOVER
       ========================================================================== */
    :root {
      --bg-scrim: rgba(0, 0, 0, 0.65);
      --glass-surface: rgba(22, 24, 32, 0.76);
      --glass-surface-hover: rgba(30, 34, 46, 0.88);
      --glass-border: rgba(255, 255, 255, 0.14);
      --glass-inner-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.22);
      
      --accent-red: #FF453A;
      --accent-orange: #FF9F0A;
      --accent-blue: #0A84FF;
      --accent-green: #30D158;
      --accent-purple: #BF5AF2;

      --text-primary: #FFFFFF;
      --text-secondary: rgba(255, 255, 255, 0.72);
      --text-tertiary: rgba(255, 255, 255, 0.45);

      --spring-physics: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", sans-serif;
      min-height: 100vh;
      width: 100vw;
      overflow: hidden;
      background: var(--bg-scrim);
      backdrop-filter: blur(48px) saturate(190%);
      -webkit-backdrop-filter: blur(48px) saturate(190%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-primary);
      position: relative;
      opacity: 0;
      animation: backdropFadeIn 0.35s var(--ease-out) forwards;
    }

    @keyframes backdropFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Ambient Background Glows */
    .ambient-glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      z-index: 1;
      opacity: 0.35;
      animation: pulseGlow 6s ease-in-out infinite alternate;
    }

    .glow-red {
      top: 15%;
      width: 440px;
      height: 440px;
      background: radial-gradient(circle, rgba(255, 69, 58, 0.45) 0%, transparent 70%);
    }

    .glow-purple {
      bottom: 15%;
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, rgba(191, 90, 242, 0.35) 0%, transparent 70%);
    }

    @keyframes pulseGlow {
      0% { transform: scale(0.95); opacity: 0.25; }
      100% { transform: scale(1.15); opacity: 0.42; }
    }

    /* Top Notch Origin Anchor */
    .notch-anchor {
      position: absolute;
      top: 0;
      width: 220px;
      height: 32px;
      background: #000000;
      border-bottom-left-radius: 16px;
      border-bottom-right-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      z-index: 10;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
      animation: notchSlideDown 0.4s var(--spring-physics) forwards;
    }

    .notch-indicator {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-red);
      box-shadow: 0 0 10px var(--accent-red);
      animation: blink 2s infinite ease-in-out;
    }

    .notch-label {
      font-size: 11px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.85);
      letter-spacing: -0.01em;
    }

    @keyframes notchSlideDown {
      from { transform: translateY(-100%); }
      to { transform: translateY(0); }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* Main Modal Card */
    .card-container {
      position: relative;
      z-index: 5;
      width: 92%;
      max-width: 480px;
      background: var(--glass-surface);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      padding: 38px 32px 32px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 
        0 32px 64px -12px rgba(0, 0, 0, 0.72),
        0 12px 24px -6px rgba(0, 0, 0, 0.5),
        var(--glass-inner-highlight);
      transform-origin: center top;
      animation: cardSpringIn 0.48s var(--spring-physics) forwards;
    }

    @keyframes cardSpringIn {
      0% {
        opacity: 0;
        transform: translateY(-40px) scale(0.92);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Shield Icon */
    .icon-wrapper {
      position: relative;
      width: 76px;
      height: 76px;
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(255, 69, 58, 0.22), rgba(255, 159, 10, 0.15));
      border: 1px solid rgba(255, 69, 58, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
      box-shadow: 0 12px 28px -6px rgba(255, 69, 58, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }

    .icon-wrapper svg {
      width: 38px;
      height: 38px;
      fill: none;
      stroke: #FF6961;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 2px 6px rgba(255, 69, 58, 0.4));
    }

    /* Badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      background: rgba(255, 69, 58, 0.16);
      border: 1px solid rgba(255, 69, 58, 0.32);
      border-radius: 20px;
      font-size: 11.5px;
      font-weight: 600;
      color: #FF8F87;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }

    .badge-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: currentColor;
    }

    /* Typography */
    h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .description {
      font-size: 14px;
      line-height: 1.45;
      color: var(--text-secondary);
      max-width: 380px;
      margin-bottom: 20px;
    }

    .site-highlight {
      font-weight: 600;
      color: #FFFFFF;
      background: rgba(255, 255, 255, 0.12);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      font-family: "SF Mono", Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
    }

    /* Quote Banner */
    .quote-box {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 14px;
      padding: 12px 16px;
      margin-bottom: 26px;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
    }

    .quote-icon {
      font-size: 16px;
      color: var(--accent-orange);
      flex-shrink: 0;
    }

    .quote-text {
      font-size: 12.5px;
      color: var(--text-secondary);
      line-height: 1.35;
      font-style: italic;
    }

    /* Buttons / Actions */
    .action-stack {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      width: 100%;
      height: 48px;
      border-radius: 14px;
      font-size: 14.5px;
      font-weight: 600;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      border: none;
      outline: none;
      position: relative;
      transition: transform 0.12s var(--ease-out), background 0.15s ease, box-shadow 0.15s ease;
    }

    .btn:active {
      transform: scale(0.975);
    }

    .btn-primary {
      background: linear-gradient(180deg, #0A84FF 0%, #0071E3 100%);
      color: #FFFFFF;
      box-shadow: 
        0 8px 20px -4px rgba(10, 132, 255, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    .btn-primary:hover {
      background: linear-gradient(180deg, #1A8EFF 0%, #087AEB 100%);
      box-shadow: 0 10px 24px -4px rgba(10, 132, 255, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.4);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.07);
      color: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .shortcut-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 6px;
      padding: 2px 6px;
      font-size: 11px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.75);
      margin-left: 6px;
    }

    /* Footer Status */
    .card-footer {
      margin-top: 18px;
      font-size: 11.5px;
      color: var(--text-tertiary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .app-tag {
      color: rgba(255, 255, 255, 0.65);
      font-weight: 500;
    }
  </style>
</head>
<body>

  <!-- Ambient Glows -->
  <div class="ambient-glow glow-red"></div>
  <div class="ambient-glow glow-purple"></div>

  <!-- Top Notch Pin -->
  <div class="notch-anchor">
    <div class="notch-indicator"></div>
    <span class="notch-label">Focus Mode Active</span>
  </div>

  <!-- Main Card -->
  <div class="card-container">
    
    <div class="badge">
      <span class="badge-dot"></span>
      <span>Distraction Shield</span>
    </div>

    <div class="icon-wrapper">
      <svg viewBox="0 0 24 24">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
    </div>

    <h1>Deep Work Session</h1>
    <p class="description">
      Akses ke <span id="siteName" class="site-highlight">Distracting Site</span> diblokir sementara agar fokus kerja tidak terpecah.
    </p>

    <div class="quote-box">
      <span class="quote-icon">⚡</span>
      <span class="quote-text" id="quoteText">"Focus is a muscle. The more you protect it, the sharper your output becomes."</span>
    </div>

    <div class="action-stack">
      <button id="closeBtn" class="btn btn-primary">
        <span>Tutup Tab & Kembali Kerja</span>
        <span class="shortcut-badge">⌘W</span>
      </button>

      <button id="bypassBtn" class="btn btn-secondary">
        <span>Bypass / Istirahat 5 Menit</span>
        <span class="shortcut-badge">Esc</span>
      </button>
    </div>

    <div class="card-footer">
      <span>Frontmost browser:</span>
      <span id="appName" class="app-tag">Google Chrome</span>
    </div>

  </div>

  <script>
    // Focus Quotes Rotation
    const quotes = [
      "Focus is a muscle. The more you protect it, the sharper your output becomes.",
      "Deep work is the superpower of the 21st century.",
      "Small disciplines repeated with consistency lead to great achievements.",
      "Starve your distractions, feed your focus.",
      "Stay in the flow — your best work is waiting."
    ];

    // Pick random quote
    document.getElementById('quoteText').textContent = '"' + quotes[Math.floor(Math.random() * quotes.length)] + '"';

    // Parse URL params if provided
    const urlParams = new URLSearchParams(window.location.search);
    const paramSite = urlParams.get('site');
    const paramApp = urlParams.get('app');

    if (paramSite) {
      document.getElementById('siteName').textContent = paramSite;
    }
    if (paramApp) {
      document.getElementById('appName').textContent = paramApp;
    }

    // Bridge actions
    function sendAction(action, payload = {}) {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.focusBlocker) {
        window.webkit.messageHandlers.focusBlocker.postMessage({ action: action, ...payload });
      } else {
        console.log("FocusBlocker action:", action, payload);
      }
    }

    const closeBtn = document.getElementById('closeBtn');
    const bypassBtn = document.getElementById('bypassBtn');

    closeBtn.addEventListener('click', () => {
      sendAction('closeTab');
    });

    bypassBtn.addEventListener('click', () => {
      sendAction('bypass', { minutes: 5 });
    });

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' || e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        sendAction('bypass', { minutes: 5 });
      } else if (e.key === 'Enter' || (e.metaKey && (e.key === 'w' || e.key === 'W'))) {
        e.preventDefault();
        sendAction('closeTab');
      }
    });

    // Dynamic update helper for Swift
    window.updateBlockerInfo = function(site, app) {
      if (site) document.getElementById('siteName').textContent = site;
      if (app) document.getElementById('appName').textContent = app;
    };
  </script>
</body>
</html>
